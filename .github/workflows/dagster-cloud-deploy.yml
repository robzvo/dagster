on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: dagster-deploy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  DAGSTER_CLOUD_URL: "https://${{ vars.DAGSTER_CLOUD_ORGANIZATION }}.dagster.cloud"

  configure:
    runs-on: ubuntu-latest
    outputs:
      deployment: ${{ steps.target.outputs.deployment }}
      is_branch_deploy: ${{ steps.target.outputs.is_branch_deploy }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Determine deployment target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "deployment=branch"       >> "$GITHUB_OUTPUT"
            echo "is_branch_deploy=true"   >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              main)    echo "deployment=prod"    >> "$GITHUB_OUTPUT" ;;
              staging) echo "deployment=staging" >> "$GITHUB_OUTPUT" ;;
              dev)     echo "deployment=dev"     >> "$GITHUB_OUTPUT" ;;
            esac
            echo "is_branch_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tag
        id: tag
        run: |
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: configure
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      # AWS ECR
      # https://github.com/aws-actions/amazon-ecr-login
      - name: Configure AWS credentials
        if: steps.prerun.outputs.result != 'skip'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:  ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        if: steps.prerun.outputs.result != 'skip'
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the "my_project" location.
      # For each code location, the "build-push-action" builds the docker
      # image and a "set-build-output" command records the image tag for each code location.
      # To re-use the same docker image across multiple code locations, build the docker image once
      # and specify the same tag in multiple "set-build-output" commands. To use a different docker
      # image for each code location, use multiple "build-push-actions" with a location specific
      # tag.
      - name: Build and upload Docker image for "my_project"
        if: steps.prerun.outputs.result != 'skip'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.IMAGE_REGISTRY }}:${{ env.IMAGE_TAG }}-my_project
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update build session with image tag for my_project
        id: ci-set-build-output-example-location
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.11.9
        with:
          command: "ci set-build-output --location-name=my_project --image-tag=$IMAGE_TAG-my_project"

